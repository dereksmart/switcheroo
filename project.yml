name: Switcheroo
options:
  bundleIdPrefix: local.switcheroo
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
targets:
  Switcheroo:
    type: application
    platform: macOS
    sources:
      - path: Switcheroo
    info:
      path: Switcheroo/Info.plist
      properties:
        LSUIElement: true
        CFBundleName: Switcheroo
        CFBundleDisplayName: Switcheroo
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: local.switcheroo.Switcheroo
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "5.9"
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        DEVELOPMENT_TEAM: ""
    postBuildScripts:
      - name: Install to /Applications (Release only)
        basedOnDependencyAnalysis: false
        script: |
          if [ "${CONFIGURATION}" = "Release" ]; then
            rm -rf /Applications/Switcheroo.app
            cp -R "${BUILT_PRODUCTS_DIR}/Switcheroo.app" /Applications/Switcheroo.app
            echo "Installed /Applications/Switcheroo.app"
          fi
schemes:
  Switcheroo:
    build:
      targets:
        Switcheroo: all
    run:
      config: Release
    test:
      config: Release
    profile:
      config: Release
    analyze:
      config: Release
    archive:
      config: Release
